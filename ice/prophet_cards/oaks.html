<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>
    <style>
        body {
            background: #FFECD7;
        }
        .bordered {
            width: 390px;
            min-width: 280px;
            height: auto;
            box-sizing: border-box;
            align-content: center;
            background-color: #008db1;
            border: 4px solid #004e63;
            border-radius: 30px;
            padding: 28px 24px;
            margin: 24px auto;
                  }
        main {
            display:grid;
            grid-template-columns: 2fr;
	    }
        h1 {
            font-size: 40px;
        }
        h2 {
            font-style: 18px, #91e4fb;
            font-family: Arial, Helvetica, sans-serif;
        }
        img {
            max-width: 240px;
            max-width: 240px;
            height: auto;
            border: 5px solid #FFFFFF;
            border-radius: 0px;
            object-fit: cover;
            margin-top: 0px;
            margin-bottom: 8px;
            }
        article {
            width: 500px;
            text-align: center;
            margin: 0 auto;
            }
    </style>
</head>
<body>

  <h1>Bordered</h1>
  <section class="bordered">Dallin H. Oaks
    <h2 class="hoverer">18th President of the Church of Jesus Christ of Latter-day Saints</h2>
      <article>
        <img src="images/oaks.webp" alt="Dallin H. Oaks">
      </article>
      <article>
        <table>
            <tbody>
                <tr> <!--table row-->
                    <th> <!--table header-->

                    </th>
                </tr>
                <tr>
                    <td colspan="2" class="blueberry">Here's an item</td> <!-- table data -->
                    <td>Here's another item</td>
                </tr>
            </tbody>
        </table>
      </article>
  </section>

  <section class="font">Fancy quaint text
    <h2>Would you believe the redness of this????</h2>

  </section>

</body>
</html>
