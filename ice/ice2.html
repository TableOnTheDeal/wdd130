<!-- creating tables and learning more about CSS -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>
    <main>
        <h1>
            Hey there, good people out there.
        </h1>
        <a href="contact.html">The text for the link.</a> <!-- making a link that isn't for css -->
        <table>
            <tbody>
                <tr> <!--table row-->
                    <th> <!--table header-->

                    </th>
                </tr>
                <tr>
                    <td colspan="2" class="blueberry">Here's an item</td> <!-- table data -->
                    <td>Here's another item</td>
                </tr>
            </tbody>
        </table>
        <h2 id="beginning"> id="beginning" Here's the first one banana</h2>
        <h2 class="blueberry">Here's the second one banana</h2>
    </main>
</body>
</html>
